  html body header nav > .km-tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; margin: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    background: var(--kanto-navy); border-top: 3px solid var(--kanto-gold);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -4px 0 rgba(0, 0, 0, .3);
  }
  html body header nav > .km-tabbar button.km-tab {
    flex-direction: column; gap: 3px; min-height: 58px; padding: 6px 2px;
    border: 0; border-radius: var(--kanto-r-btn); font-size: .8125rem !important; line-height: 1.1 !important;
    transform: none; box-shadow: none;
  }
  html body header nav > .km-tabbar button.km-tab:is(:hover, :active) { transform: none; box-shadow: none; }
  html body header nav > .km-tabbar .ico { width: 1.6em; height: 1.6em; }
  html body header nav > .km-tabbar .km-num { display: none; }
  html body:has(.km-tabbar) main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  html body:has(.km-tabbar) .km-demo-badge { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
  html body header .py-3\.5 { padding-top: .625rem; padding-bottom: .625rem; }
  /* con la barra abajo, "Volver a mi base" sobra en cada estacion */
  html body:has(.km-tabbar) main button.group:has(use[href="#i-back"]) { display: none; }
}
/* Texto minimo legible tambien en el panel del profesor (antes 9px) */
@media screen { html body:not(.kid-mode) .text-\[9px\]:not(.z-\[80\] *) { font-size: .8125rem; } }

/* --- 10. Movimiento reducido: ya existe la regla global; aqui tambien quitamos el rebote de botones --- */
@media (prefers-reduced-motion: reduce) {
  html body button:hover, html body button:active { transform: none !important; }
}

/* ===== PRUEBA DE DISEÑO (impeccable) — borrar este bloque para volver a v12 ===== */
/* Todo en @media screen: la impresión (cartas, diploma) queda intacta, como en el tema */
@media screen {
  /* Jerarquía: los títulos de tarjeta eran más pequeños que el texto; líneas de ~65 caracteres */
  html body .km-rotom h2 { font-size: 1.375rem; line-height: 1.25; }
  html body main :is(h3.font-retro.text-base:not(.truncate), h2.km-hoy) { font-size: 1.25rem; }
  html body .km-rotom p { max-width: 65ch; text-wrap: pretty; }
  /* Profesor (body sin .kid-mode): Rotom en una franja fina; el mensaje es para los alumnos y ocupaba ~200px */
  html body:not(.kid-mode) .km-rotom { flex-direction: row; align-items: center; gap: 1rem; padding: .75rem 1.25rem; }
  html body:not(.kid-mode) .km-rotom > [aria-hidden="true"], html body:not(.kid-mode) .km-rotom h2 { display: none; }
  html body:not(.kid-mode) .km-rotom :is(.animate-float, .animate-float img) { width: 4rem; height: 4rem; padding: 0; }
  html body:not(.kid-mode) .km-rotom .animate-float { border-width: 2px; }
  html body:not(.kid-mode) .km-rotom :is(.flex-grow, .flex-grow > .flex) { text-align: left; justify-content: flex-start; }
  html body:not(.kid-mode) .km-rotom p { font-size: .9375rem; }
}
@media screen and (max-width: 639px) {
  /* Cabecera: 1 fila menos (colegio y escuadrón ya salen en "Tu misión de hoy") y avatar más pequeño */
  html body header :is(.km-school, span.bg-black\/60) { display: none; }
  html body header .w-14.h-14 { width: 2.75rem; height: 2.75rem; }
  html body header h1 { font-size: 1rem !important; min-width: 0; overflow-wrap: anywhere; }
  /* Rotom compacto: sprite a la izquierda, mensaje a la derecha, la misión se ve sin bajar */
  html body .km-rotom { flex-direction: row; align-items: flex-start; gap: .875rem; padding: 1rem; }
  html body .km-rotom > [aria-hidden="true"] { display: none; }
  html body .km-rotom :is(.animate-float, .animate-float img) { width: 4rem; height: 4rem; padding: 0; }
  html body .km-rotom :is(.flex-grow, .flex-grow > .flex) { text-align: left; justify-content: flex-start; gap: .5rem; }
  html body .km-rotom span.bg-red-600 { font-size: .75rem !important; padding: .25rem .5rem; }
  html body .km-rotom h2 { font-size: 1.125rem; }
  html body main.space-y-8 > :not([hidden]) ~ :not([hidden]) { margin-top: 1.25rem; }
  /* La cabecera del alumno ya no es fija: la barra de abajo ya da la navegación (~150px más de pantalla) */
  html body:has(.km-tabbar) header.sticky { position: static; }
  /* Colección: buscador a todo el ancho y los 3 filtros en una sola fila */
  html body :is(.km-filtros, .km-filtros > *) { width: 100%; }
  html body .km-filtros > [role="group"] { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
  html body .km-filtros > [role="group"] > button { padding-left: .25rem; padding-right: .25rem; white-space: normal; line-height: 1.15; text-wrap: balance; font-size: .9375rem; }
  /* Equipo titular: menos relleno alrededor (era 32px por lado) */
  html body .km-equipo { padding: 1rem; }
  html body .km-equipo > .grid { gap: .75rem; }
  html body .km-equipo > .grid > div { padding: .75rem .625rem; }
  html body .km-equipo > .grid button { font-size: .875rem !important; padding-left: .25rem; padding-right: .25rem; }
  html body .km-equipo > .grid button.bg-red-900 { min-width: 2.75rem; flex: none; }
  /* Aviso DEMO: tras entrar, solo una etiqueta pequeña que no tapa la misión */
  html body:has(.km-tabbar) .km-demo-badge { font-size: 0 !important; padding: 3px 8px !important; }
  html body:has(.km-tabbar) .km-demo-badge::before { content: "DEMO"; font-size: 11px; }
  /* Premios: el saldo se queda arriba al bajar (la cabecera ya no es fija) */
  html body .km-saldo { position: sticky; top: 0; z-index: 30; background: var(--kanto-navy); padding: .625rem .875rem; border-radius: var(--kanto-r-btn); border: 2px solid var(--kanto-gold); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  /* Que el foco no quede tapado por el saldo fijo de arriba ni por la barra de pestañas de abajo */
  html { scroll-padding-top: 5rem; scroll-padding-bottom: 6rem; }
  /* Premios: tarjetas más bajas, caben ~3 por pantalla en vez de 2 */
  html body .km-premio { padding: 1rem; }
  html body .km-premio > :not([hidden]) ~ :not([hidden]) { margin-top: .75rem; }
  html body .km-premio .text-4xl { font-size: 2rem; line-height: 1; margin-bottom: .25rem; }
  html body .km-premio button { padding-top: .625rem; padding-bottom: .625rem; }
  /* Profesor: las 5 pestañas en una fila deslizable; relative para que el .sr-only "sin leer" no desborde la página */
  html body .km-profe-tabs { position: relative; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: -6px -1rem -4px; padding: 6px 1rem 8px; scroll-padding-inline: 1rem; }
  html body .km-profe-tabs > button { flex: none; }
}
/* ===== FIN PRUEBA ===== */

function walk(wp){const c=[];let [cx,cy]=wp[0];c.push([cx,cy]);
  for(let i=1;i<wp.length;i++){const [tx,ty]=wp[i];while(cx!==tx||cy!==ty){if(cx!==tx)cx+=Math.sign(tx-cx);else cy+=Math.sign(ty-cy);c.push([cx,cy])}}return c}

  requestAnimationFrame(loop); // reprogramar antes de dibujar: un canvas con datos malos no puede parar los demás

    if(!cv.isConnected){reg.delete(cv);return}

    if(e.kind==='city'&&!RM){const d=e.tg-e.p;if(Math.abs(d)>.02){e.p+=Math.sign(d)*Math.min(Math.abs(d),(now-(e.last||now))/1000*7);move=true}else e.p=e.tg}
    try{if(move||now-(e.drawn||0)>320){e.drawn=now;paint(e,now)}}
    catch(err){reg.delete(cv);console.error('KantoMap',err)}
    e.last=now});}

function setup(cv,kind,w,h){if(cv.width!==w){cv.width=w;cv.height=h}

    cv.addEventListener('click',ev=>{const f=reg.get(cv);if(!f||!f.opts.onPick)return;

      const tx=Math.floor((ev.clientX-r.left)*W2/r.width/T),ty=Math.floor((ev.clientY-r.top)*H2/r.height/T);
      for(let k=0;k<f.opts.n;k++){const sl=L.slots[k];
        if((tx>=sl.h[0]&&tx<=sl.h[0]+2&&ty>=sl.h[1]&&ty<=sl.h[1]+2)||(tx===sl.d[0]&&ty===sl.d[1])){f.opts.onPick(k);return}}})}}
function region(cv,o){if(!cv)return;const e=setup(cv,'region',W,H);e.opts=o;e.drawn=0;

function injectCss(){if(css)return;css=true;const s=document.createElement('style');

const SLOTH=156; // alto de cada hueco del rodillo
// gira a velocidad constante hasta PLANO del tiempo y luego frena hasta pararse; POKES = Pokémon que se ven pasar por segundo
const PLANO=.72,VELN=2/(1+PLANO),POKES=6.3;
function spin(el,o){ // tragaperras de 3 rodillos: {items:[{name,img,shiny}], win:index, tick, onEnd}
  if(!el)return;injectCss();const items=o.items||[];if(!items.length){if(o.onEnd)o.onEnd();return}
  const w=Math.max(0,Math.min(items.length-1,o.win|0));
  const mk=it=>{const d=document.createElement('div');d.className='km-cell';
    const i=document.createElement('img');i.alt=it.name;i.loading='eager';i.onerror=()=>{i.style.visibility='hidden'};i.src=it.img;d.appendChild(i);
    const s=document.createElement('span');s.textContent=(it.shiny?'★ ':'')+it.name;d.appendChild(s);return d};
  // una tragaperras real repite unos pocos símbolos: así no hay que descargar decenas de sprites y se ve girar aunque la red vaya lenta
  const simb=[items[w]];for(let i=0;i<5;i++)simb.push(items[Math.floor(Math.random()*items.length)]);
  el.innerHTML='';const caja=document.createElement('div');caja.className='km-slot';caja.setAttribute('aria-hidden','true');el.appendChild(caja);
  const rodillos=[],metas=[];
  for(let c=0;c<3;c++){const col=document.createElement('div');col.className='km-col';
    const r=document.createElement('div');r.className='km-colr';col.appendChild(r);
    const ln=document.createElement('div');ln.className='km-line';col.appendChild(ln);caja.appendChild(col);rodillos.push(r)}

  const acabar=()=>{if(parado||!el.isConnected)return;if(++fin===3){parado=true;if(o.onEnd)o.onEnd()}};
  rodillos.forEach((r,c)=>{
    const dur=(RM?1500:2600)+c*(RM?450:800),WIN=Math.max(4,Math.round(POKES*dur/1000/VELN)),TOT=WIN+3;
    for(let i=0;i<TOT;i++)r.appendChild(mk(i===WIN?items[w]:simb[Math.floor(Math.random()*simb.length)]));
    const target=WIN*SLOTH,t0=performance.now();let li=-1;metas[c]=target;
    (function step(now){if(parado)return; // ya se ha saltado al premio
      const f=Math.min(1,(now-t0)/dur),u=(f-PLANO)/(1-PLANO),
        e=f<PLANO?VELN*f:VELN*(PLANO+(1-PLANO)*(1-Math.pow(1-u,2))/2),off=target*e;

      if(f<1){if(!parado&&el.isConnected)requestAnimationFrame(step)}else acabar()})(t0)})

  return ()=>{if(parado)return;parado=true;rodillos.forEach((r,c)=>{r.style.transform='translateY('+(-metas[c])+'px)'});if(o.onEnd)o.onEnd()}}

function chest(o){ // {titulo, sub, head, text, items, win, tick, onEnd, onClose}

  const zona=document.createElement('div');zona.style.width='100%';wrap.appendChild(zona);

  const btn=document.createElement('button');btn.className='km-btn';btn.textContent='🎰 ABRIR COFRE';wrap.appendChild(btn);
  let skip=null,abierto=false,cerrado=false;
  const cerrar=()=>{if(cerrado)return;cerrado=true;document.removeEventListener('keydown',esc);ov.remove();if(prev&&prev.isConnected)prev.focus();if(o.onClose)o.onClose()};
  const esc=e=>{if(e.key==='Escape')cerrar();else if(e.key==='Tab'){e.preventDefault();(document.activeElement===btn?x:btn).focus()}};
  document.addEventListener('keydown',esc);
  x.onclick=cerrar;
  const premio=()=>{
    caja.hidden=true;prize.hidden=false;prize.innerHTML='';
    const it=(o.items||[])[o.win];
    if(it&&it.img){const im=document.createElement('img');im.src=it.img;im.alt=it.name;im.onerror=()=>{im.style.display='none'};prize.appendChild(im)}
    const b=document.createElement('div');b.className='km-big';b.textContent=o.head||'';prize.appendChild(b);
    const t=document.createElement('p');t.textContent=o.text||'';prize.appendChild(t);
    btn.textContent='Cerrar';btn.className='km-btn';btn.disabled=false;btn.onclick=cerrar;
    if(o.onEnd)o.onEnd()};
  btn.onclick=()=>{
    if(abierto)return;abierto=true;

    btn.className='km-btn sec';btn.textContent='Ver mi premio ya';

  document.body.appendChild(ov);
  btn.focus();
  return cerrar}

return {city:city,region:region,spin:spin,chest:chest,themes:CITIES.map(c=>c.th)};

                toggleBgm() {
                    this.bgmPlaying = !this.bgmPlaying;
                    if (this.bgmPlaying) {
                        this.startChiptuneBgm();
                    } else {
                        this.stopChiptuneBgm();
                    }
                },

                startChiptuneBgm() {
                    try {
                        if (!this.audioCtx) {
                            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        }
                        if (this.audioCtx.state === 'suspended') {
                            this.audioCtx.resume();
                        }
                        const loFiChords = [
                            [261.63, 329.63, 392.00],
                            [220.00, 261.63, 329.63],
                            [349.23, 440.00, 523.25],
                            [392.00, 493.88, 587.33]
                        ];
                        let chordIdx = 0;
                        this.bgmInterval = setInterval(() => {
                            if (!this.bgmPlaying || !this.audioCtx) return;
                            const chord = loFiChords[chordIdx % loFiChords.length];
                            
                            chord.forEach((freq) => {
                                const osc = this.audioCtx.createOscillator();
                                const filter = this.audioCtx.createBiquadFilter();
                                const gain = this.audioCtx.createGain();
                                
                                osc.connect(filter);
                                filter.connect(gain);
                                gain.connect(this.audioCtx.destination);
                                
                                osc.type = 'triangle';
                                filter.type = 'lowpass';
                                filter.frequency.setValueAtTime(500, this.audioCtx.currentTime);
                                
                                osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                                gain.gain.setValueAtTime(0.001, this.audioCtx.currentTime);
                                gain.gain.linearRampToValueAtTime(0.025, this.audioCtx.currentTime + 0.2);
                                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 1.4);
                                
                                osc.start(this.audioCtx.currentTime);
                                osc.stop(this.audioCtx.currentTime + 1.5);
                            });
                            chordIdx++;
                        }, 1200);
                    } catch(e) {}
                },

                stopChiptuneBgm() {
                    this.bgmPlaying = false;
                    if (this.bgmInterval) {
                        clearInterval(this.bgmInterval);
                        this.bgmInterval = null;
                    }
                },

                // voz de Rotom: la más natural que tenga el dispositivo, sin leer emojis y algo más lenta
                pickVoice() {
                    const vs = window.speechSynthesis.getVoices() || [];
                    const es = vs.filter(v => /^es/i.test(v.lang));
                    if (!es.length) return null;
                    const buenas = ['mónica', 'monica', 'lucía', 'lucia', 'paulina', 'helena', 'google español', 'español de españa', 'microsoft elvira', 'microsoft helena'];
                    for (const n of buenas) { const v = es.find(x => x.name.toLowerCase().includes(n)); if (v) return v; }
                    return es.find(v => /es-ES/i.test(v.lang)) || es[0];
                },
                speakText(text) {
                    try {
                        if (!('speechSynthesis' in window)) return;
                        const limpio = String(text)
                            .replace(/[\u{1F300}-\u{1FAFF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu, ' ')
                            .replace(/[*_#•·|]/g, ' ')
                            .replace(/\s+/g, ' ')
                            .trim();
                        if (!limpio) return;
                        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
                        const u = new SpeechSynthesisUtterance(limpio);
                        u.lang = 'es-ES';
                        u.rate = 0.92;
                        u.pitch = 1.05;
                        u.volume = 1;
                        const v = this.pickVoice();
                        if (v) u.voice = v;
                        window.speechSynthesis.speak(u);
                    } catch(e) {}
                },

                speakRotomMessage() {
                    this.speakText(this.rotomMessage);
                },

                playSound(type) {
                    if (!this.sfxOn) return;
                    try {
                        const ctx = this.audioCtx || (this.audioCtx = new (window.AudioContext || window.webkitAudioContext)());
                        const now = ctx.currentTime;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        if (type === 'click') {
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(440, now);
                            gain.gain.setValueAtTime(0.08, now);
                            osc.start(now);
                            osc.stop(now + 0.05);
                        } else if (type === 'token') {
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(987.77, now);
                            osc.frequency.setValueAtTime(1318.51, now + 0.08);
                            gain.gain.setValueAtTime(0.1, now);
                            osc.start(now);
                            osc.stop(now + 0.2);
                        } else if (type === 'pokeball') {
                            const oscThump = ctx.createOscillator();
                            const gainThump = ctx.createGain();
                            oscThump.connect(gainThump); gainThump.connect(ctx.destination);
                            oscThump.type = 'sine';
                            oscThump.frequency.setValueAtTime(150, now);
                            oscThump.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                            gainThump.gain.setValueAtTime(0.15, now);
                            oscThump.start(now); oscThump.stop(now + 0.12);

                            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                                const o = ctx.createOscillator();
                                const g = ctx.createGain();
                                o.connect(g); g.connect(ctx.destination);
                                o.type = 'triangle';
                                o.frequency.setValueAtTime(freq, now + 0.15 + (i * 0.08));
                                g.gain.setValueAtTime(0.12, now + 0.15 + (i * 0.08));
                                o.start(now + 0.15 + (i * 0.08));
                                o.stop(now + 0.15 + (i * 0.08) + 0.08);
                            });
                        } else if (type === 'victory') {
                            const notes = [523.25, 659.25, 783.99, 1046.5];
                            notes.forEach((freq, i) => {
                                const o = ctx.createOscillator();
                                const g = ctx.createGain();
                                o.connect(g); g.connect(ctx.destination);
                                o.type = 'square';
                                o.frequency.setValueAtTime(freq, now + i * 0.1);
                                g.gain.setValueAtTime(0.1, now + i * 0.1);
                                o.start(now + i * 0.1);
                                o.stop(now + i * 0.1 + 0.09);
                            });
                        }

                async api(path, method = 'GET', body) {
                    // cualquier escritura invalida los refrescos en vuelo: si no, el refresco pisa lo que el profe acaba de tocar
                    if (method === 'GET') return this._api(path, method, body);

                    try { return await this._api(path, method, body); }
                    finally { this._mut = (this._mut || 0) + 1; }
                },
                async _api(path, method = 'GET', body) {
                    const headers = { 'Content-Type': 'application/json' };
                    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
                    let res;
                    const ctl = new AbortController();
                    const to = setTimeout(() => ctl.abort(), 12000);
                    try {
                        res = await fetch('/api' + path, { method, headers, signal: ctl.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
                    } catch (e) {
                        throw new Error('Sin conexión con el servidor. Inténtalo de nuevo.');
                    } finally { clearTimeout(to); }
                    let data = {};
                    try { data = await res.json(); } catch (e) {}
                    if (!res.ok) {
                        if (res.status === 401 && this.token) this.sessionExpired();
                        const err = new Error(data.error || 'Error del servidor.');
                        err.status = res.status;
                        throw err;
                    }
                    return data;
                },

                                if (p && fp !== this._lastPoll && ((p.pendingChests || []).length || (p.pendingNotifications || []).length)) { this._lastPoll = fp; const st = this.station; this.selectStudent(p); if (st === 'mail') this.openMyMail(); }

                saveCurrentProfile(clearNotices = false) {

                async _doSave(c, clearNotices, my) {

                    if (clearNotices) body.pendingNotifications = [];
                    const KEYS = ['tokens', 'ownedPokemon', 'activeTeam', 'redeemedRewards', 'shinyPokemon', 'shinyUnlocked', 'streak'];
                    try {
                        const d = await this.api('/me', 'PUT', body);
                        if (d.profile && this.currentStudent === c && my === this._saveN) for (const k of KEYS) if (d.profile[k] !== undefined) c[k] = d.profile[k];
                    } catch (e) {

                        this.notify('No se ha podido guardar. Revisa la conexión e inténtalo otra vez.');

                selectStudent(student) {

                    this.chestRoll = null; this.activeLoginNotification = null; this.currentNotificationQueue = [];
                    this.activeStudentTarget = null; this.activeSwapSlot = null; this.selectedGymModal = null; this.showChooseModal = false; this.mapSel = null;
                    if (this.currentStudentId !== student.id) { this.myMail = []; this.mailDraft = ''; }
                    this.currentStudentId = student.id;

                    const vistos = new Set(); // un perfil antiguo pudo guardar repetidos y el servidor ya no los acepta

                },
                phaseNext() { if (this.board && this.board.phase < 2) this.boardSave({ phase: this.board.phase + 1 }); },
                phasePrev() { if (this.board && this.board.phase > 0) this.boardSave({ phase: this.board.phase - 1 }); },
                openPlanEditor() {
                    if (!this.aulaSession) return;
                    const p = this.boardPlan;
                    this.planDraft = { warmup: p.warmup || '', main: p.main || '', cooldown: p.cooldown || '', material: p.material || '' };
                    this.showPlanEditor = true;
                },
                async savePlan() {
                    const s = this.aulaSession;
                    if (!s) return;
                    try {
                        const d = await this.api('/teacher/plan', 'PUT', { key: s.gIdx + '-' + s.sIdx, plan: this.planDraft });
                        this.plans = d.plans;
                        this.showPlanEditor = false;
                    } catch (e) { this.notify(e.message); }
                },
                get tmView() {
                    const t = this.board && this.board.timer;
                    const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
                    if (!t) return { text: '00:00', sub: '', color: 'text-white', running: false, key: '' };
                    const running = t.status === 'running';
                    const el = running ? Math.max(0, this.tmNow - t.startedAt) : (t.pausedElapsedMs || 0);
                    if (t.mode === 'stopwatch') { const s = Math.floor(el / 1000); return { text: fmt(s), sub: 'Cronómetro', color: 'text-amber-300', running, key: 's' + s, secLeft: -1 }; }
                    if (t.mode === 'countdown') {
                        const rem = Math.max(0, t.durationSec * 1000 - el), s = Math.ceil(rem / 1000), done = running && rem === 0;
                        return { text: done ? '¡TIEMPO!' : fmt(s), sub: 'Cuenta atrás', color: done ? 'text-red-400 animate-pulse' : (s <= 10 && running ? 'text-red-400' : 'text-white'), running, done, secLeft: s, key: 'c' + s, type: 'countdown' };
                    }
                    const cyc = (t.work + t.rest) * 1000, total = cyc * t.rounds;
                    if (t.status === 'idle') return { text: fmt(t.work), sub: 'Circuito · ' + t.rounds + ' rondas de ' + t.work + 's / ' + t.rest + 's', color: 'text-white', running: false, key: 'idle' };
                    if (el >= total) return { text: '¡FIN!', sub: 'Circuito completado', color: 'text-emerald-400 animate-pulse', running, done: true, secLeft: 0, key: 'end', type: 'intervals' };
                    const idx = Math.floor(el / cyc), within = el % cyc, work = within < t.work * 1000;
                    const left = work ? t.work * 1000 - within : cyc - within, s = Math.ceil(left / 1000), len = work ? t.work : t.rest;
                    return { text: fmt(s), sub: 'Ronda ' + (idx + 1) + '/' + t.rounds + ' · ' + (work ? '¡TRABAJO!' : 'DESCANSO'), color: work ? 'text-emerald-400' : 'text-red-400', running, secLeft: s, atStart: s === len, key: 'i' + idx + (work ? 'w' : 'r') + s, type: 'intervals' };
                },
                tmBeeps() {
                    const v = this.tmView;
                    if (!this.beepOn || !v.running || v.key === this._lastBeepKey) return;
                    this._lastBeepKey = v.key;
                    if (v.done) this.beep(1200, 500);
                    else if (v.secLeft >= 1 && v.secLeft <= 3) this.beep(880, 120);
                    else if (v.type === 'intervals' && v.atStart) this.beep(520, 400);
                },
                tmStart() {
                    const t = this.board.timer;
                    if (t.status === 'running') return;
                    this.ensureAudio();
                    this.boardSave({ timer: { ...t, status: 'running', startedAt: this.nowServer() - (t.pausedElapsedMs || 0) } });
                },
                tmPause() {
                    const t = this.board.timer;
                    if (t.status !== 'running') return;
                    this.boardSave({ timer: { ...t, status: 'paused', pausedElapsedMs: Math.max(0, this.nowServer() - t.startedAt) } });
                },
                tmToggle() { if (this.board) (this.board.timer.status === 'running' ? this.tmPause() : this.tmStart()); },
                tmReset() { if (this.board) this.boardSave({ timer: { ...this.board.timer, status: 'idle', pausedElapsedMs: 0, startedAt: 0 } }); },
                tmPreset(sec) { this.boardSave({ timer: { ...this.board.timer, mode: 'countdown', durationSec: sec, status: 'idle', pausedElapsedMs: 0, startedAt: 0 } }); },
                tmStopwatch() { this.boardSave({ timer: { ...this.board.timer, mode: 'stopwatch', status: 'idle', pausedElapsedMs: 0, startedAt: 0 } }); },
                tmIntervals(work, rest, rounds) { this.boardSave({ timer: { ...this.board.timer, mode: 'intervals', work, rest, rounds, status: 'idle', pausedElapsedMs: 0, startedAt: 0 } }); },
                async tmCustomTime() {
                    const v = await this.askText('⏱️ Minutos de la cuenta atrás (ej. 7 o 7.5)', '');
                    const m = parseFloat(String(v || '').replace(',', '.'));
                    if (v !== null && m > 0 && m <= 120) this.tmPreset(Math.round(m * 60));
                },
                async tmCustomCircuit() {
                    const v = await this.askText('🔁 Circuito: trabajo, descanso, rondas (segundos, segundos, nº). Ej: 30,15,6', '30,15,6');
                    if (v === null) return;
                    const [w, r, n] = String(v).split(/[ ,;]+/).map(x => parseInt(x, 10));
                    if (w >= 5 && w <= 600 && r >= 0 && r <= 600 && n >= 1 && n <= 30) this.tmIntervals(w, r, n);
                    else this.notify('Escribe tres números: trabajo (5-600), descanso (0-600) y rondas (1-30).');
                },
                shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
                get presentStudents() { const d = this.todayStr(); return this.profilesList.filter(s => !(s.att && s.att[d] === 'F')); },
                drawPick() {
                    const pool = this.presentStudents;
                    if (!pool.length) { this.notify('No hay alumnos presentes.'); return; }
                    let drawn = [...(this.board.drawn || [])];
                    let left = pool.filter(s => !drawn.includes(s.id));
                    if (!left.length) { drawn = []; left = pool; }
                    const w = left[Math.floor(Math.random() * left.length)];
                    drawn.push(w.id);
                    this.playSound('pokeball');
                    this.boardSave({ draw: { kind: 'pick', items: [this.shortName(w.name)] }, drawn });
                },
                drawPairs() {
                    const names = this.shuffle(this.presentStudents).map(s => this.shortName(s.name));
                    if (names.length < 2) { this.notify('Hacen falta al menos 2 alumnos presentes.'); return; }
                    const g = [];
                    for (let i = 0; i < names.length; i += 2) g.push(names.slice(i, i + 2));
                    if (g.length > 1 && g[g.length - 1].length === 1) g[g.length - 2].push(g.pop()[0]);
                    this.playSound('pokeball');
                    this.boardSave({ draw: { kind: 'pairs', items: g } });
                },
                // Reparto voraz: cada alumno (por escuadrón y de más a menos sesiones, empates al azar) va al equipo con menos gente, luego con menos de su escuadrón, luego con menos sesiones.
                balancedTeams(pool, k) {
                    const order = this.shuffle(pool).map(s => ({ s, f: s.faction || 'Rayo', lv: this.totalSessions(s) })).sort((a, b) => a.f.localeCompare(b.f) || b.lv - a.lv);
                    const g = Array.from({ length: k }, () => ({ m: [], lv: 0, f: {} }));
                    order.forEach(p => {
                        const t = g.reduce((best, x) => ((x.m.length - best.m.length) || ((x.f[p.f] || 0) - (best.f[p.f] || 0)) || (x.lv - best.lv)) < 0 ? x : best);
                        t.m.push(p.s); t.lv += p.lv; t.f[p.f] = (t.f[p.f] || 0) + 1;
                    });
                    return g.map(x => x.m);
                },
                drawTeams() {
                    const pool = this.presentStudents;
                    const k = Math.min(8, Math.max(2, Math.ceil(pool.length / 16), parseInt(this.teamCount, 10) || 4), pool.length); // el servidor guarda como mucho 16 nombres por equipo
                    if (k < 2) { this.notify('Hacen falta al menos 2 alumnos presentes.'); return; }
                    this.playSound('pokeball');
                    this.boardSave({ draw: { kind: 'teams', items: this.balancedTeams(pool, k).map(t => t.map(s => this.shortName(s.name))) } });
                },
                get drawAnnounce() {
                    const d = this.board && this.board.draw;
                    if (!d) return '';
                    if (d.kind === 'pick') return 'Ha salido ' + d.items[0];
                    return d.items.map((g, i) => (d.kind === 'pairs' ? 'Pareja ' + (i + 1) : this.drawBalls[i % this.drawBalls.length][0]) + ': ' + g.join(', ')).join('; ');
                },
                drawClear() { this.boardSave({ draw: null }); const b = document.getElementById('km-draw-pick'); if (b) b.focus(); },
                todayStr() { return new Date().toLocaleDateString('sv-SE'); },
                attMark(s) { return (s.att && s.att[this.todayStr()]) || 'P'; },
                attStats(s) {
                    const v = Object.values(s.att || {});
                    return { F: v.filter(x => x === 'F').length, R: v.filter(x => x === 'R').length };
                },
                attHistory(s) {
                    const e = Object.entries(s.att || {}).sort().reverse().slice(0, 4);
                    return e.length ? e.map(([d, m]) => (m === 'F' ? '❌' : '⏰') + d.slice(5)).join(' · ') : 'Sin incidencias';
                },
                get attCounts() {
                    const c = { P: 0, F: 0, R: 0 };
                    this.profilesList.forEach(s => { c[this.attMark(s)]++; });
                    return c;
                },
                get attIsClosed() { return this.attClosed.includes(this.todayStr()); },
                attSet(student, mark) {
                    const date = this.todayStr(), prev = student.att ? { ...student.att } : {}, next = { ...prev };
                    if (mark === 'P') delete next[date]; else next[date] = mark;
                    this.attAutoClose();
                    student.att = next; // optimista, y las peticiones de un mismo alumno van en cola para que no se crucen
                    const seq = student._attSeq = (student._attSeq || 0) + 1;
                    return student._attQ = (student._attQ || Promise.resolve()).then(async () => {
                        try {
                            const d = await this.api('/teacher/attendance', 'PUT', { date, id: student.id, mark });
                            if (seq === student._attSeq) student.att = d.profile.att || {};
                        } catch (e) { if (seq === student._attSeq) student.att = prev; this.notify(e.message); }
                    });
                },
                // tocar cualquier marca da la lista del día por pasada (así los días sin tocar nada no cuentan como «todos presentes» en el CSV)
                async attAutoClose() {
                    if (this.attIsClosed) return;
                    const date = this.todayStr();
                    this.attClosed = [...this.attClosed, date];
                    try { const d = await this.api('/teacher/attendance', 'PUT', { date, closed: true }); this.attClosed = d.attClosed; } catch (e) { this.attClosed = this.attClosed.filter(x => x !== date); }
                },
                attCycle(student) { return this.attSet(student, ({ P: 'F', F: 'R', R: 'P' })[this.attMark(student)]); },
                async attAllPresent() {
                    const date = this.todayStr();
                    try {
                        await this.api('/teacher/attendance', 'PUT', { date, all: 'P' });
                        this.attAutoClose();
                        this.profilesList.forEach(s => { if (s.att && s.att[date]) { const n = { ...s.att }; delete n[date]; s.att = n; } });
                    } catch (e) { this.notify(e.message); }
                },
                async attToggleClosed() {
                    try {
                        const d = await this.api('/teacher/attendance', 'PUT', { date: this.todayStr(), closed: !this.attIsClosed });
                        this.attClosed = d.attClosed;
                    } catch (e) { this.notify(e.message); }
                },
                classIcon(s) {
                    const m = this.attMark(s);
                    if (this.classMode === 'att') return ({ P: '✅', F: '❌', R: '⏰' })[m];
                    if (m === 'F') return '🚫';
                    return this.aulaDone(s) ? '✅' : '⬜';
                },
                cardClass(s) {
                    const m = this.attMark(s);
                    if (this.classMode === 'att') return m === 'F' ? 'bg-red-950/60 border-red-500' : (m === 'R' ? 'bg-yellow-900/40 border-yellow-500' : 'bg-slate-950 border-slate-700');
                    if (m === 'F') return 'bg-slate-900 border-slate-800 opacity-50';
                    return this.aulaDone(s) ? 'bg-emerald-900/60 border-emerald-400' : 'bg-slate-950 border-slate-700';
                },
                classTap(s) {
                    if (this.classMode === 'att') return this.attCycle(s);
                    if (this.attMark(s) === 'F' || !this.aulaSession) return;
                    return this.aulaToggle(s);
                },
                totalSessions(s) { return (s.gymSessionsData || []).reduce((a, g) => a + (g || []).filter(Boolean).length, 0); },
                badgeCount(s) { return (s.badges || []).filter(Boolean).length; },
                getStudentXp(s) { return this.totalSessions(s) * 10 + this.badgeCount(s) * 100; },
                get dirList() {
                    const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    const q = norm(this.dirSearch);
                    const l = this.profilesList.filter(s => (this.dirFilter === 'all' || s.faction === this.dirFilter) && (!q || norm(s.name).includes(q)));
                    const cmp = ({
                        name: (a, b) => String(a.name).localeCompare(String(b.name), 'es'),
                        tokens: (a, b) => (b.tokens || 0) - (a.tokens || 0),
                        progreso: (a, b) => this.getStudentXp(b) - this.getStudentXp(a),
                        faltas: (a, b) => this.attStats(b).F - this.attStats(a).F
                    })[this.dirSort];
                    return [...l].sort(cmp);
                },
                downloadCSV(name, rows) {
                    const esc = v => { v = String(v === undefined || v === null ? '' : v); if (/^[=+\-@\t\r]/.test(v) && isNaN(Number(v))) v = "'" + v; return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
                    const csv = '\ufeff' + rows.map(r => r.map(esc).join(';')).join('\n');
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                    a.download = name;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                },
                exportProgressCSV() {
                    const rows = [['Nombre', 'Escuadrón', 'Fichas', 'Medallas', 'Sesiones completadas', 'XP', 'Faltas', 'Retrasos']];
                    this.profilesList.forEach(s => { const a = this.attStats(s); rows.push([s.name, s.faction || 'Rayo', s.tokens || 0, this.badgeCount(s), this.totalSessions(s), this.getStudentXp(s), a.F, a.R]); });
                    this.downloadCSV('progreso-liga-kanto-' + this.todayStr() + '.csv', rows);
                },
                exportAttendanceCSV() {
                    const set = new Set(this.attClosed);
                    this.profilesList.forEach(s => Object.keys(s.att || {}).forEach(d => set.add(d)));
                    const ds = [...set].sort();
                    const rows = [['Nombre', ...ds]];
                    this.profilesList.forEach(s => rows.push([s.name, ...ds.map(d => (s.att && s.att[d]) || (this.attClosed.includes(d) ? 'P' : ''))]));
                    this.downloadCSV('asistencia-liga-kanto-' + this.todayStr() + '.csv', rows);
                },
                // --- buzón ---
                async openMyMail() {
                    this.station = 'mail';
                    try { this.myMail = (await this.api('/me/messages')).messages; } catch (e) { this.notify(e.message); return; }
                    const ids = this.myMail.filter(m => m.reply && !m.seen).map(m => m.id);
                    if (ids.length || this.currentStudent.mailNew) this.api('/me/messages/seen', 'POST', { ids }).then(d => { this.currentStudent.mailNew = d.profile.mailNew; }).catch(() => {});
                },
                async sendMyMail() {
                    if (this.mailBusy) return;
                    this.mailBusy = true;
                    try {
                        const sent = this.mailDraft;
                        this.myMail = (await this.api('/me/messages', 'POST', { text: sent })).messages;
                        if (this.mailDraft === sent) this.mailDraft = '';
                        this.playSound('click');
                        this.notify('Tu pregunta ha llegado al profe. Te avisaremos cuando responda.', '✉️ ¡Enviada!');
                    } catch (e) { this.notify(e.message); }
                    finally { this.mailBusy = false; }
                },
                get mailUnread() { return this.mail.filter(m => !m.read).length; },
                mailList(f) { return this.mail.filter(m => f === 'all' || (f === 'done') === !!m.reply); },
                mailWhen(t) { return new Date(t).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); },
                async loadMail() {
                    if (this.currentRole !== 'teacher') return;
                    try {
                        this.mail = (await this.api('/teacher/messages')).messages;
                        if (this.mailSel) this.mailSel = this.mail.find(m => m.id === this.mailSel.id) || null;
                    } catch (e) { console.error(e); }
                },
                openMail(m) {
                    this.mailSel = m;
                    this.mailReply = m.reply || '';
                    this.$nextTick(() => this.$refs.mailReply?.focus());
                    if (!m.read) { m.read = true; this.api('/teacher/messages/' + m.sid + '/' + m.id, 'PUT', { read: true }).catch(() => { m.read = false; }); }
                },
                async _mailDo(method, body) {
                    const m = this.mailSel;
                    if (!m || this.mailBusy) return false;
                    this.mailBusy = true;
                    try { await this.api('/teacher/messages/' + m.sid + '/' + m.id, method, body); await this.loadMail(); return true; }
                    catch (e) { this.notify(e.message); return false; }
                    finally { this.mailBusy = false; }
                },
                async replyMail() { if (await this._mailDo('PUT', { reply: this.mailReply })) { this.playSound('click'); this.mailMsg = 'Respuesta enviada'; } },
                async markMail(read) { if (await this._mailDo('PUT', { read })) this.mailMsg = read ? 'Marcada como leída' : 'Marcada como nueva'; },
                async deleteMail() {
                    if (!this.mailSel || !(await this.askConfirm('Se borrará este mensaje y el alumno ya no lo verá.', '¿Borrar mensaje?'))) return;
                    if (await this._mailDo('DELETE')) { this.mailSel = null; this.mailMsg = 'Mensaje borrado'; this.$nextTick(() => document.querySelector('[aria-label="Filtrar mensajes"] button')?.focus()); }
                },
                logout() {
                    this.stopChiptuneBgm();
                    // tablet compartida y proyector: ningún modal con datos del anterior puede seguir en pantalla
                    this.selectedGymModal = null; this.activeStudentTarget = null; this.activeSwapSlot = null;
                    this.showChooseModal = false; this.showFamilyReportModal = false; this.detail = null;
                    this.token = null;
                    this.currentRole = null;
                    this.currentStudentId = null;
                    this.chestRoll = null;
                    this.activeLoginNotification = null;
                    this.currentNotificationQueue = [];
                    this.myMail = []; this.mailDraft = ''; this.mail = []; this.mailSel = null; this.mailReply = '';
                    this.loadProfiles();
                }
            }
        }
</script>

<div x-show="detail" style="display:none" class="fixed inset-0 z-40 bg-black/80 overflow-auto p-4 no-print" @keydown.escape.window="detail = null">
    <template x-for="student in (detail ? [detail] : [])" :key="student.id">
        <div class="max-w-5xl mx-auto bg-slate-900 border-4 border-amber-500 rounded-2xl p-6 space-y-5 my-6">
            <div class="flex items-center justify-between gap-4 flex-wrap">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 bg-black/40 rounded-lg flex items-center justify-center border border-slate-600 overflow-hidden"><img :src="student.gender === 'boy' ? 'https://play.pokemonshowdown.com/sprites/trainers/red-gen3.png' : 'https://play.pokemonshowdown.com/sprites/trainers/leaf-gen3.png'" class="w-10 h-10 object-contain" alt="Trainer"></div>
                    <div>
                        <h4 class="font-retro text-xl text-amber-300" x-text="student.name"></h4>
                        <p class="text-sm text-slate-300" x-text="'🛡️ ' + (student.faction || 'Rayo') + ' · XP: ' + getStudentXp(student)"></p>
                    </div>
                </div>
                <div class="flex gap-2 flex-wrap items-center">
                    <span x-show="saveFlash" class="text-emerald-400 font-bold">✓ Guardado</span>
                    <button @click="playSound('click'); openFamilyReport(student)" class="px-4 py-2 rounded text-xs bg-purple-600 text-white font-retro">📄 Informe PDF</button>
                    <button @click="playSound('token'); teacherSaveStudent(student).then(ok => { if (ok) { saveFlash = true; setTimeout(() => saveFlash = false, 2000); } })" class="px-4 py-2 rounded text-xs bg-emerald-600 text-white font-retro">💾 Guardar</button>
                    <button @click="teacherDeleteStudent(student).then(() => { if (!profilesList.some(s => s.id === student.id)) detail = null; })" class="px-4 py-2 rounded text-xs bg-red-700 text-white font-retro" title="Borrar alumno">🗑️</button>
                    <button @click="detail = null" class="px-4 py-2 rounded text-xs bg-slate-700 text-slate-100 font-retro">✕ Cerrar</button>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                <div class="bg-slate-950 rounded-xl p-3">
                    <p class="text-2xl font-extrabold text-amber-300" x-text="'🪙 ' + (student.tokens || 0)"></p>
                    <div class="flex gap-2 justify-center mt-2">
                        <button @click="aulaBonus(student, -1)" class="px-3 py-1 rounded bg-slate-800 border border-slate-600 text-xs font-retro text-slate-200">−1</button>
                        <button @click="aulaBonus(student, 1)" class="px-3 py-1 rounded bg-amber-400 text-amber-950 text-xs font-retro font-bold">🤝 +1</button>
                    </div>
                </div>
                <div class="bg-slate-950 rounded-xl p-3"><p class="text-2xl font-extrabold text-amber-300" x-text="'🏅 ' + badgeCount(student) + '/8'"></p><p class="text-xs text-slate-400 mt-1">Medallas</p></div>
                <div class="bg-slate-950 rounded-xl p-3"><p class="text-2xl font-extrabold text-amber-300" x-text="'⚡ ' + totalSessions(student)"></p><p class="text-xs text-slate-400 mt-1">Sesiones</p></div>
                <div class="bg-slate-950 rounded-xl p-3"><p class="text-2xl font-extrabold text-amber-300" x-text="'❌ ' + attStats(student).F + ' · ⏰ ' + attStats(student).R"></p><p class="text-xs text-slate-400 mt-1" x-text="attHistory(student)"></p></div>
            </div>
            <div class="bg-slate-950 rounded-xl p-4 space-y-2" x-show="pendingRewardsOf(student).length">
                <p class="font-retro text-xs text-amber-300">🎁 CANJES PENDIENTES</p>
                <div class="flex flex-wrap gap-2">
                    <template x-for="(tt, n) in pendingRewardsOf(student)" :key="n">
                        <button @click="aulaUseReward(student, tt, true)" class="px-3 py-2 rounded bg-slate-800 border border-slate-600 text-xs font-mono text-slate-100"><span x-text="tt"></span> <span class="text-emerald-400">✓ Usado</span></button>
                    </template>
                </div>
            </div>
            <div class="p-6 md:p-8 border-t border-slate-800 space-y-6 font-mono text-sm bg-slate-900/60" x-transition>
                                    <div class="bg-slate-900 p-5 rounded-xl border-2 border-amber-500/80 space-y-3">
                                        <div class="flex items-center gap-3 text-amber-300 font-retro text-xs">
                                            <svg class="ico" aria-hidden="true"><use href="#i-key"/></svg>
                                            <span>CÓDIGO SECRETO (RECUPERACIÓN):</span>
                                        </div>
                                        <div class="flex gap-3 items-center flex-wrap">
                                            <button @click="playSound('token'); teacherResetCode(student)" class="px-5 py-3 bg-emerald-600 text-white font-retro text-sm rounded-xl hover:bg-emerald-500 font-bold">🎲 Código nuevo de emojis</button>
                                        </div>
                                        <p class="text-xs text-slate-400">🔒 Los códigos se guardan cifrados y no se pueden ver. Si un alumno lo olvida, genera uno nuevo y díselo.</p>
                                        <div class="pt-4 border-t border-slate-700 space-y-3">
                                            <span class="text-xs font-retro text-amber-300 block">📊 DATOS DE CONDICIÓN FÍSICA (solo los ves tú)</span>
                                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div><label class="block text-slate-300 text-xs mb-1">Peso (kg):</label><input type="number" x-model="student.weight" class="w-full p-2.5 rounded bg-black/60 border border-slate-700 text-slate-200 text-base font-bold"></div><div><label class="block text-slate-300 text-xs mb-1">Altura (cm):</label><input type="number" x-model="student.height" class="w-full p-2.5 rounded bg-black/60 border border-slate-700 text-slate-200 text-base font-bold"></div><div><label class="block text-slate-300 text-xs mb-1">Envergadura (cm):</label><input type="number" x-model="student.wingspan" class="w-full p-2.5 rounded bg-black/60 border border-slate-700 text-slate-200 text-base font-bold"></div><div><label class="block text-slate-300 text-xs mb-1">Pulso reposo (bpm):</label><input type="number" x-model="student.hrRest" class="w-full p-2.5 rounded bg-black/60 border border-slate-700 text-slate-200 text-base font-bold"></div></div>
                                            <label class="block text-xs text-slate-300">📝 Nota privada (solo la ves tú):</label>
                                            <textarea x-model="student.note" rows="2" class="w-full p-3 rounded bg-black/60 border border-slate-700 text-slate-200 text-sm"></textarea>
                                            <p class="text-xs text-slate-400">Pulsa 💾 Guardar para guardar estos datos.</p>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <template x-for="(gym, gIndex) in gyms" :key="gIndex">
                                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                                <div class="flex justify-between items-center">
                                                    <span class="font-retro text-xs text-amber-300 truncate" x-text="gym.shortName"></span>
                                                    <span class="px-2.5 py-1 rounded text-xs font-retro" :class="student.badges && student.badges[gIndex] ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-300'" x-text="student.badges && student.badges[gIndex] ? '✓ Medalla' : '¡Te espera!'"></span>
                                                </div>
                                                <div class="flex gap-2 pt-1">
                                                    <button @click="playSound('click'); openGymModalForStudent(student, gIndex)" class="flex-1 py-2.5 bg-slate-800 text-amber-300 font-retro text-xs rounded border border-slate-700 hover:bg-slate-700">⚙️ Sesiones</button>
                                                    <button @click="playSound('token'); toggleAllGymSessionsForStudent(student, gIndex)" class="px-3 py-2.5 bg-emerald-700 text-white font-retro text-xs rounded hover:bg-emerald-600 font-bold" x-text="student.badges && student.badges[gIndex] ? '↺ Limpiar' : '⚡ 100%'"></button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
        </div>
    </template>
</div>
<div class="km-demo-badge" style="position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9999;pointer-events:none;background:#f59e0b;color:#1c1917;font:700 12px Nunito,sans-serif;padding:5px 10px;border-radius:999px;opacity:.92">DEMO v14 · datos de ejemplo · profesor: <b>demo</b> · alumnos: 3 emojis cualquiera</div>
</body></html>
