<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga del Movimiento - Kanto (Pokédex 151 Completa, Antropometría & Fair Play)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .font-retro { font-family: 'Press Start 2P', monospace; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(251,191,36,0.8)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 15px rgba(251,191,36,1)); }
        }
        .animate-badge { animation: pulse-badge 2s infinite; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>
</head>
<body x-data="appState()" x-init="initFirebase()" :class="getThemeBg()" class="min-h-screen flex flex-col transition-colors duration-300">

    <!-- LANDING & AUTH OVERLAY -->
    <template x-if="!currentStudentId && currentRole !== 'teacher'">
        <div class="fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-4 overflow-y-auto">
            <div class="max-w-4xl w-full p-6 md:p-10 rounded-2xl border-4 border-amber-400 bg-slate-900 text-slate-100 shadow-2xl space-y-8 my-8">
                
                <template x-if="showLanding">
                    <div class="space-y-8">
                        <div class="text-center space-y-3">
                            <div class="w-20 h-20 bg-amber-400 text-amber-950 border-4 border-amber-600 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl animate-float">
                                ⚡
                            </div>
                            <span class="bg-amber-400 text-amber-950 font-retro px-3 py-1 text-[10px] uppercase rounded font-bold">
                                🏫 Educación Física • 4º de Primaria
                            </span>
                            <h1 class="font-retro text-base md:text-xl text-amber-300 mt-2">LIGA DEL MOVIMIENTO - KANTO</h1>
                            <p class="text-xs md:text-sm text-slate-300 font-mono max-w-2xl mx-auto">
                                ¡Bienvenido a la aventura gamificada de EF! Supera las sesiones en pista supervisadas por tu profesor, gana **Tokens**, completa tu Pokédex con los 151 Pokémon y gestiona tu equipo titular.
                            </p>
                        </div>

                        <!-- Fair Play & Classroom Rules -->
                        <div class="bg-slate-800/90 p-6 rounded-xl border-4 border-amber-500/60 space-y-4 font-mono text-xs">
                            <div class="flex items-center gap-3 border-b border-slate-700 pb-3">
                                <span class="text-2xl">📜</span>
                                <div>
                                    <h3 class="font-retro text-xs text-amber-300">Normas de Conducta & Reglas de Oro (Fair Play)</h3>
                                    <p class="text-slate-300">Compromiso obligatorio para todos los entrenadores en el polideportivo:</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-slate-200">
                                <div class="flex items-start gap-2">
                                    <span class="text-amber-400 font-bold">1.</span>
                                    <p><b>Respeto absoluto:</b> Cuidado de los compañeros, profesores y material deportivo.</p>
                                </div>
                                <div class="flex items-start gap-2">
                                    <span class="text-amber-400 font-bold">2.</span>
                                    <p><b>Esfuerzo personal:</b> Supera tus propios retos sin comparar tus marcas con los demás.</p>
                                </div>
                                <div class="flex items-start gap-2">
                                    <span class="text-amber-400 font-bold">3.</span>
                                    <p><b>Juego Limpio:</b> La ayuda mutua y el trabajo en equipo puntúan siempre el doble.</p>
                                </div>
                                <div class="flex items-start gap-2">
                                    <span class="text-amber-400 font-bold">4.</span>
                                    <p><b>Validación Profesor:</b> Las sesiones en pista, medallas y tokens son verificadas exclusivamente por el maestro.</p>
                                </div>
                            </div>
                        </div>

                        <div class="text-center pt-2">
                            <button @click="playSound('victory'); showLanding = false" class="px-8 py-4 bg-amber-400 text-amber-950 text-xs rounded-xl hover:bg-amber-300 shadow-xl transition transform hover:scale-105 font-retro">
                                🚀 ¡ENTENDIDO! ACCEDER A PERFILES ➔
                            </button>
                        </div>
                    </div>
                </template>

                <template x-if="!showLanding">
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b-2 border-slate-700 pb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-amber-400 text-amber-950 border-4 border-amber-600 rounded-xl flex items-center justify-center text-2xl shadow">
                                    ⚡
                                </div>
                                <div>
                                    <h1 class="font-retro text-xs text-amber-300">ACCESO SEGURO DE ALUMNOS</h1>
                                    <p class="text-[11px] text-slate-300 font-mono">Selecciona tu perfil o inicia sesión con contraseña</p>
                                </div>
                            </div>
                            <button @click="playSound('click'); showLanding = true" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded text-xs font-mono border border-slate-600 hover:bg-slate-700">
                                📖 Normas EF
                            </button>
                        </div>

                        <template x-if="loadingProfiles">
                            <div class="text-center py-8 font-retro text-xs text-amber-400 animate-pulse">
                                Sincronizando con la nube...
                            </div>
                        </template>

                        <template x-if="!loadingProfiles">
                            <div class="space-y-6">
                                <div class="flex border-b-2 border-slate-700 pb-2 gap-2 flex-wrap">
                                    <button @click="playSound('click'); authTab = 'select'" :class="authTab === 'select' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="flex-1 py-2 rounded text-xs font-retro border border-slate-700 transition min-w-[110px]">
                                        👥 Alumnos
                                    </button>
                                    <button @click="playSound('click'); authTab = 'register'" :class="authTab === 'register' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="flex-1 py-2 rounded text-xs font-retro border border-slate-700 transition min-w-[110px]">
                                        ✨ Crear Alumno
                                    </button>
                                    <button @click="playSound('click'); authTab = 'teacher'" :class="authTab === 'teacher' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-amber-900/60 text-amber-300'" class="flex-1 py-2 rounded text-xs font-retro border border-amber-600 transition min-w-[110px]">
                                        👨‍🏫 Maestro EF
                                    </button>
                                </div>

                                <template x-if="authTab === 'select'">
                                    <div class="space-y-4">
                                        <h3 class="font-retro text-xs text-slate-300">Selecciona tu perfil:</h3>
                                        <div class="max-h-56 overflow-y-auto space-y-2 pr-1">
                                            <template x-for="student in profilesList" :key="student.id">
                                                <div @click="playSound('click'); openLoginModal(student)" class="bg-slate-800 border-2 border-slate-700 hover:border-amber-400 p-3 rounded-xl flex items-center justify-between cursor-pointer transition">
                                                    <div class="flex items-center gap-3">
                                                        <div class="w-12 h-12 bg-black/40 rounded-lg flex items-center justify-center border border-slate-600 overflow-hidden">
                                                            <img :src="student.gender === 'boy' ? 'https://play.pokemonshowdown.com/sprites/trainers/red-gen3.png' : 'https://play.pokemonshowdown.com/sprites/trainers/leaf-gen3.png'" class="w-10 h-10 object-contain">
                                                        </div>
                                                        <div>
                                                            <h4 class="font-retro text-xs text-amber-300" x-text="student.name"></h4>
                                                            <p class="text-[10px] text-slate-300 font-mono" x-text="(student.school || 'Colegio') + ' • Medallas: ' + (student.badges ? student.badges.filter(b=>b).length : 0) + '/8'"></p>
                                                        </div>
                                                    </div>
                                                    <button class="px-3 py-1.5 rounded text-[9px] bg-emerald-600 text-white font-retro">Entrar ➔</button>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="selectedStudentForLogin">
                                    <div class="bg-slate-950 p-4 rounded-xl border-2 border-amber-400 space-y-3 font-mono text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="text-amber-300 font-retro text-[10px]" x-text="'Acceso para: ' + selectedStudentForLogin.name"></span>
                                            <button @click="playSound('click'); selectedStudentForLogin = null" class="text-red-400 text-sm font-bold">✕</button>
                                        </div>
                                        <div>
                                            <label class="block text-slate-300 mb-1">Contraseña:</label>
                                            <input type="password" x-model="loginPasswordInput" placeholder="Introduce tu contraseña..." class="w-full p-2 rounded bg-black/60 border border-slate-700 text-slate-200">
                                        </div>
                                        <div class="flex gap-2 pt-1">
                                            <button @click="verifyAndLogin()" class="flex-1 py-2 rounded text-[10px] bg-emerald-600 text-white font-retro">✓ Iniciar Sesión</button>
                                            <button @click="playSound('click'); selectedStudentForLogin = null" class="bg-slate-800 text-slate-300 px-3 py-2 rounded border border-slate-700">Cancelar</button>
                                        </div>
                                        <p class="text-[10px] text-red-400 text-center" x-text="loginErrorMsg"></p>
                                    </div>
                                </template>

                                <template x-if="authTab === 'register'">
                                    <div class="space-y-4 font-mono text-xs">
                                        <h3 class="font-retro text-xs text-amber-300">✨ Registrar Nuevo Alumno:</h3>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div>
                                                <label class="block text-slate-300 font-bold mb-1">Nombre:</label>
                                                <input type="text" x-model="newStudent.name" placeholder="Tu nombre..." class="w-full p-2 rounded bg-black/60 border border-slate-700 text-slate-200">
                                            </div>
                                            <div>
                                                <label class="block text-slate-300 font-bold mb-1">Colegio:</label>
                                                <input type="text" x-model="newStudent.school" placeholder="Colegio Kanto" class="w-full p-2 rounded bg-black/60 border border-slate-700 text-slate-200">
                                            </div>
                                            <div>
                                                <label class="block text-slate-300 font-bold mb-1">Contraseña:</label>
                                                <input type="password" x-model="newStudent.password" placeholder="Contraseña..." class="w-full p-2 rounded bg-black/60 border border-slate-700 text-slate-200">
                                            </div>
                                            <div>
                                                <label class="block text-slate-300 font-bold mb-1">PIN (4 números):</label>
                                                <input type="text" maxlength="4" x-model="newStudent.pin" placeholder="1234" class="w-full p-2 rounded bg-black/60 border border-slate-700 text-slate-200 text-center tracking-widest">
                                            </div>
                                        </div>
                                        <div class="flex gap-4 items-center justify-between pt-1">
                                            <div class="flex gap-2">
                                                <button @click="playSound('click'); newStudent.gender = 'boy'" :class="newStudent.gender === 'boy' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="px-3 py-1.5 rounded border border-slate-700">👦 Chico</button>
                                                <button @click="playSound('click'); newStudent.gender = 'girl'" :class="newStudent.gender === 'girl' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'" class="px-3 py-1.5 rounded border border-slate-700">👧 Chica</button>
                                            </div>
                                            <button @click="createNewStudent()" class="px-4 py-2 bg-emerald-600 text-white font-retro rounded text-[10px]">+ Registrar</button>
                                        </div>
                                        <p class="text-[10px] text-amber-300 text-center" x-text="createErrorMsg"></p>
                                    </div>
                                </template>

                                <template x-if="authTab === 'teacher'">
                                    <div class="space-y-4 font-mono text-xs">
                                        <h3 class="font-retro text-xs text-amber-300">👨‍🏫 Acceso Profesor (Contraseña: profesor2026)</h3>
                                        <div>
                                            <label class="block text-slate-300 font-bold mb-1">Contraseña Maestro:</label>
                                            <input type="password" x-model="teacherPasswordInput" placeholder="profesor2026" class="w-full p-2 rounded bg-black/60 border border-amber-500 text-slate-200">
                                        </div>
                                        <button @click="verifyTeacherLogin()" class="w-full py-2.5 rounded text-[10px] bg-amber-400 text-amber-950 font-retro font-bold">🔑 Entrar al Panel Maestro</button>
                                        <p class="text-[10px] text-red-400 text-center" x-text="teacherErrorMsg"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <header :class="getHeaderClass()" class="border-b-4 sticky top-0 z-40 shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            
            <template x-if="currentRole === 'student'">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-amber-400 border-4 border-slate-900 flex items-center justify-center shadow rounded-lg">
                        <img :src="currentStudent.gender === 'boy' ? 'https://play.pokemonshowdown.com/sprites/trainers/red-gen3.png' : 'https://play.pokemonshowdown.com/sprites/trainers/leaf-gen3.png'" class="w-9 h-9 object-contain drop-shadow">
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="font-retro text-xs md:text-sm text-amber-300 tracking-wider" x-text="currentStudent.name"></h1>
                            <button @click="playSound('click'); logout()" class="text-[9px] bg-red-900 text-red-200 px-2 py-0.5 rounded font-mono hover:bg-red-800">Salir</button>
                        </div>
                        <p class="text-xs opacity-90 font-mono" x-text="(currentStudent.school || 'Kanto')"></p>
                    </div>
                </div>
            </template>

            <template x-if="currentRole === 'teacher'">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-amber-400 border-4 border-amber-900 flex items-center justify-center shadow rounded-lg text-2xl">👨‍🏫</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="font-retro text-xs md:text-sm text-amber-300">PANEL MAESTRO EF</h1>
                            <button @click="playSound('click'); logout()" class="text-[9px] bg-red-900 text-red-200 px-2 py-0.5 rounded font-mono">Salir</button>
                        </div>
                        <p class="text-xs text-slate-300 font-mono">Validador Oficial de Sesiones, Medallas & Tokens</p>
                    </div>
                </div>
            </template>
            
            <div class="flex items-center gap-4">
                <template x-if="currentRole === 'student'">
                    <div class="bg-amber-400 text-amber-950 px-3 py-1.5 rounded-lg border-2 border-amber-600 font-retro text-[10px] flex items-center gap-2 shadow">
                        <i class="fa-solid fa-coins text-amber-700"></i>
                        <span>Tokens: <strong x-text="currentStudent.tokens"></strong></span>
                    </div>
                </template>

                <nav class="flex flex-wrap gap-2 font-retro text-[10px]">
                    <template x-if="currentRole === 'student'">
                        <div class="flex flex-wrap gap-2">
                            <button @click="playSound('click'); tab = 'map'" :class="tab === 'map' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">🗺️ Mapa</button>
                            <button @click="playSound('click'); tab = 'profile'" :class="tab === 'profile' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">🎨 Ficha</button>
                            <button @click="playSound('click'); tab = 'badges'" :class="tab === 'badges' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">🏅 Medallas</button>
                            <button @click="playSound('click'); tab = 'pokedex'" :class="tab === 'pokedex' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">📖 Pokédex</button>
                            <button @click="playSound('click'); tab = 'team'" :class="tab === 'team' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">⭐ Equipo</button>
                            <button @click="playSound('click'); tab = 'rewards'" :class="tab === 'rewards' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">🎁 Premios</button>
                            <button @click="playSound('click'); tab = 'hof'" :class="tab === 'hof' ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-200'" class="px-3 py-2 rounded border border-slate-700">🏆 Hall Fama</button>
                        </div>
                    </template>
                    <template x-if="currentRole === 'teacher'">
                        <button @click="playSound('click'); tab = 'teacher_dashboard'" class="px-3 py-2 rounded bg-amber-400 text-amber-950 font-bold">📋 Control Alumnos</button>
                    </template>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        
        <div :class="getCardClass()" class="p-6 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden border-4 rounded-xl shadow-xl">
            <div class="absolute right-2 -bottom-4 opacity-10 text-9xl">⚡</div>
            <div class="w-24 h-24 flex-shrink-0 bg-black/30 border-4 border-amber-400/50 rounded-2xl flex items-center justify-center p-2 animate-float">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/479.png" class="w-20 h-20 object-contain drop-shadow">
            </div>
            <div class="flex-grow text-center md:text-left z-10">
                <span class="bg-amber-400 text-amber-950 font-retro px-3 py-1 text-[10px] uppercase rounded font-bold">🤖 Rotom-Pizarra Cloud</span>
                <h2 class="font-retro text-sm md:text-base text-amber-300 mt-3 mb-2" x-text="currentRole === 'teacher' ? '¡Panel de Control Maestro!' : ('¡Hola, ' + currentStudent.name + '!')"></h2>
                <p class="text-xs md:text-sm leading-relaxed font-mono opacity-90" x-text="rotomMessage"></p>
            </div>
        </div>

        <!-- TEACHER DASHBOARD -->
        <template x-if="currentRole === 'teacher'">
            <div class="space-y-6">
                <div class="flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h3 class="font-retro text-base text-amber-300">👨‍🏫 Panel Maestro - Validación de Sesiones, Medallas & Tokens</h3>
                        <p class="text-xs text-slate-300 opacity-80">Marca las sesiones superadas en pista. Cada sesión otorga +1 Token automáticamente, y al completar el 100% se otorga la Medalla.</p>
                    </div>
                    <button @click="playSound('click'); loadProfiles()" class="px-3 py-2 rounded bg-amber-400 text-amber-950 font-retro text-xs">🔄 Actualizar</button>
                </div>

                <div class="bg-slate-900 p-6 rounded-xl border-4 border-amber-500 shadow-2xl space-y-6">
                    <template x-for="student in profilesList" :key="student.id">
                        <div class="bg-slate-950 p-6 rounded-xl border-2 border-slate-700 space-y-4 font-mono text-xs">
                            <div class="flex justify-between items-center flex-wrap gap-2 border-b border-slate-800 pb-3">
                                <div>
                                    <h5 class="font-retro text-xs text-amber-300" x-text="student.name"></h5>
                                    <p class="text-[10px] text-slate-300" x-text="(student.school || 'Colegio') + ' • Tokens: ' + student.tokens + ' • Medallas: ' + (student.badges ? student.badges.filter(b=>b).length : 0) + '/8'"></p>
                                </div>
                                <button @click="playSound('click'); teacherSaveStudent(student)" class="px-3 py-1.5 rounded text-[9px] bg-emerald-600 text-white font-retro">💾 Guardar Cloud</button>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <template x-for="(gym, gIndex) in gyms" :key="gIndex">
                                    <div class="bg-slate-900/70 p-3 rounded-lg border border-slate-700 space-y-2">
                                        <div class="flex justify-between items-center">
                                            <span class="font-retro text-[9px] text-amber-300 truncate" x-text="gym.shortName"></span>
                                            <span class="px-2 py-0.5 rounded text-[9px] font-retro" :class="student.badges && student.badges[gIndex] ? 'bg-amber-400 text-amber-950 font-bold' : 'bg-slate-800 text-slate-300'" x-text="student.badges && student.badges[gIndex] ? '✓ Medalla' : 'Pendiente'"></span>
                                        </div>
                                        <button @click="playSound('click'); openGymModalForStudent(student, gIndex)" class="w-full py-1.5 bg-slate-800 text-amber-300 font-retro text-[9px] rounded border border-slate-700 hover:bg-slate-700">⚙️ Gestionar Sesiones</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- STUDENT VIEWS -->
        <template x-if="currentRole === 'student'">
            <div class="space-y-8">
                
                <!-- 1. MAP & SESSIONS TAB -->
                <div x-show="tab === 'map'" class="space-y-6">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h3 class="font-retro text-base text-amber-300">Mapa Táctico - Región Kanto (Sesiones Oficiales EF)</h3>
                            <p class="text-xs opacity-80 font-mono">Haz clic en cualquier gimnasio para ver las sesiones y tu progreso verificado por el maestro.</p>
                        </div>
                    </div>

                    <div :class="getCardClass()" class="p-6 rounded-xl border-4 shadow-2xl space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <template x-for="(gym, index) in gyms" :key="index">
                                <div @click="playSound('click'); openGymModal(index)" :class="currentStudent.badges && currentStudent.badges[index] ? 'border-amber-400 bg-slate-900' : 'border-slate-700 opacity-90'" class="p-5 border-4 rounded-xl relative transition transform hover:scale-[1.02] cursor-pointer bg-slate-950">

                playSound(type) {
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        const now = ctx.currentTime;

                        if (type === 'click') {
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(440, now);
                            gain.gain.setValueAtTime(0.08, now);
                            osc.start(now);
                            osc.stop(now + 0.05);
                        } else if (type === 'token') {
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(987.77, now);
                            osc.frequency.setValueAtTime(1318.51, now + 0.08);
                            gain.gain.setValueAtTime(0.1, now);
                            osc.start(now);
                            osc.stop(now + 0.2);
                        } else if (type === 'victory') {
                            const notes = [523.25, 659.25, 783.99, 1046.5];
                            notes.forEach((freq, i) => {
                                const o = ctx.createOscillator();
                                const g = ctx.createGain();
                                o.connect(g);
                                g.connect(ctx.destination);
                                o.type = 'square';
                                o.frequency.setValueAtTime(freq, now + i * 0.1);
                                g.gain.setValueAtTime(0.1, now + i * 0.1);
                                o.start(now + i * 0.1);
                                o.stop(now + i * 0.1 + 0.09);
                            });
                        }
                    } catch(e) {}
                },

                get earnedBadgesCount() {
                    return this.currentStudent.badges ? this.currentStudent.badges.filter(b => b).length : 0;
                },
                get filteredPokedex() {
                    let list = this.pokedexList;
                    if(this.pokeFilter === 'owned') list = list.filter(p => this.isOwned(p.name));
                    if(this.pokeSearch.trim() !== '') {
                        const q = this.pokeSearch.toLowerCase();
                        list = list.filter(p => p.name.toLowerCase().includes(q) || p.id.includes(q) || p.type.toLowerCase().includes(q));
                    }
                    return list;
                },
                isOwned(pokeName) {
                    return this.currentStudent.ownedPokemon && this.currentStudent.ownedPokemon.includes(pokeName);
                },
                openGymModal(gIndex) {
                    this.selectedGymModal = gIndex;
                    this.activeStudentTarget = this.currentStudent;
                },
                openGymModalForStudent(student, gIndex) {
                    this.selectedGymModal = gIndex;
                    this.activeStudentTarget = student;
                },
                ensureGymSessionsData(student) {
                    if (!student.gymSessionsData || student.gymSessionsData.length !== this.gyms.length) {
                        student.gymSessionsData = this.gyms.map(gym => new Array(gym.sessions.length).fill(false));
                    }
                },
                isSessionCompleted(student, gIndex, sIndex) {
                    if (!student) student = this.currentStudent;
                    this.ensureGymSessionsData(student);
                    return !!student.gymSessionsData[gIndex][sIndex];
                },
                toggleGymSession(student, gIndex, sIndex) {
                    if (this.currentRole !== 'teacher') return;
                    if (!student) student = this.currentStudent;
                    this.ensureGymSessionsData(student);
                    
                    student.gymSessionsData[gIndex][sIndex] = !student.gymSessionsData[gIndex][sIndex];
                    if (student.gymSessionsData[gIndex][sIndex]) {
                        student.tokens = (student.tokens || 0) + 1;
                    } else {
                        student.tokens = Math.max(0, (student.tokens || 0) - 1);
                    }

                    const gym = this.gyms[gIndex];
                    const completedCount = student.gymSessionsData[gIndex].filter(Boolean).length;
                    if(!student.badges) student.badges = [false,false,false,false,false,false,false,false];
                    if (completedCount === gym.sessions.length && !student.badges[gIndex]) {
                        student.badges[gIndex] = true;
                    } else if (completedCount < gym.sessions.length && student.badges[gIndex]) {
                        student.badges[gIndex] = false;
                    }
                },
                getGymCompletedCount(gIndex) {
                    const target = this.activeStudentTarget || this.currentStudent;
                    if (!target || !target.gymSessionsData || !target.gymSessionsData[gIndex]) return 0;
                    return target.gymSessionsData[gIndex].filter(Boolean).length;
                },

                openSwapModal(idx) {
                    this.activeSwapSlot = idx;
                },
                assignToSlot(idx, pokeName) {
                    if(!this.currentStudent.activeTeam) this.currentStudent.activeTeam = [null,null,null,null,null,null];
                    this.currentStudent.activeTeam[idx] = pokeName;
                    this.activeSwapSlot = null;
                    this.saveCurrentProfile();
                },
                addToFirstAvailableTeam(pokeName) {
                    if (this.currentStudent.activeTeam.includes(pokeName)) return;
                    const emptyIdx = this.currentStudent.activeTeam.indexOf(null);
                    if (emptyIdx !== -1) {
                        this.currentStudent.activeTeam[emptyIdx] = pokeName;
                        this.saveCurrentProfile();
                    }
                },
                removeFromTeam(idx) {
                    this.currentStudent.activeTeam[idx] = null;
                    this.saveCurrentProfile();
                },

                getThemeBg() {
                    const th = this.currentStudent?.theme || 'emerald';
                    switch(th) {
                        case 'red': return 'bg-red-950 text-slate-100';
                        case 'pink': return 'bg-pink-950 text-slate-100';
                        case 'water': return 'bg-blue-950 text-slate-100';
                        case 'electric': return 'bg-amber-950 text-slate-100';
                        case 'dark': return 'bg-zinc-950 text-slate-100';
                        default: return 'bg-emerald-950 text-slate-100';
                    }
                },
                getHeaderClass() {
                    const th = this.currentStudent?.theme || 'emerald';
                    switch(th) {
                        case 'red': return 'bg-red-900 border-red-700';
                        case 'pink': return 'bg-pink-900 border-pink-700';
                        case 'water': return 'bg-blue-900 border-blue-700';
                        case 'electric': return 'bg-amber-900 border-amber-700';
                        case 'dark': return 'bg-zinc-900 border-zinc-700';
                        default: return 'bg-emerald-900 border-emerald-700';
                    }
                },
                getCardClass() {
                    const th = this.currentStudent?.theme || 'emerald';
                    switch(th) {
                        case 'red': return 'bg-red-950 border-red-600 text-red-50';
                        case 'pink': return 'bg-pink-950 border-pink-600 text-pink-50';
                        case 'water': return 'bg-blue-950 border-blue-600 text-blue-50';
                        case 'electric': return 'bg-amber-950 border-amber-600 text-amber-50';
                        case 'dark': return 'bg-zinc-900 border-purple-600 text-zinc-50';
                        default: return 'bg-emerald-950 border-emerald-600 text-emerald-50';
                    }
                },
                recruitPokemon(poke) {
                    if (this.currentStudent.tokens >= poke.cost && !this.isOwned(poke.name)) {
                        this.currentStudent.tokens -= poke.cost;
                        if (!this.currentStudent.ownedPokemon) this.currentStudent.ownedPokemon = ['Pikachu'];
                        this.currentStudent.ownedPokemon.push(poke.name);
                        const emptyIdx = this.currentStudent.activeTeam.indexOf(null);
                        if (emptyIdx !== -1) this.currentStudent.activeTeam[emptyIdx] = poke.name;
                        this.saveCurrentProfile();
                    }
                },
                redeemReward(reward) {
                    if (this.currentStudent.tokens >= reward.cost) {
                        this.currentStudent.tokens -= reward.cost;
                        if (!this.currentStudent.redeemedRewards) this.currentStudent.redeemedRewards = [];
                        this.currentStudent.redeemedRewards.push(reward.title);
                        this.saveCurrentProfile();
                    }
                },
                getPokeSprite(pokeName) {
                    const found = this.pokedexList.find(p => p.name === pokeName);
                    return found ? found.sprite : 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png';
                },
                async initFirebase() {
                    try {
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = FB.initializeApp(firebaseConfig);
                        this.db = FB.getFirestore(app);
                        this.auth = FB.getAuth(app);
                        await FB.signInAnonymously(this.auth);
                        await this.loadProfiles();
                    } catch (e) {
                        this.loadingProfiles = false;
                    }
                },
                async loadProfiles() {
                    if (!this.db) { this.loadingProfiles = false; return; }
                    try {
                        this.loadingProfiles = true;
                        const snap = await FB.getDocs(FB.collection(this.db, 'artifacts', this.appId, 'public', 'data', 'secure_students_sessions_v12'));
                        this.profilesList = [];
                        snap.forEach(d => {
                            const data = d.data();
                            if(!data.gymSessionsData) data.gymSessionsData = this.gyms.map(g => new Array(g.sessions.length).fill(false));
                            this.profilesList.push({ id: d.id, ...data });
                        });
                    } catch (e) {
                    } finally {
                        this.loadingProfiles = false;
                    }
                },
                openLoginModal(student) { this.selectedStudentForLogin = student; this.loginPasswordInput = ''; this.loginErrorMsg = ''; },
                verifyAndLogin() {
                    if (this.selectedStudentForLogin.password && this.selectedStudentForLogin.password !== this.loginPasswordInput) {
                        this.loginErrorMsg = "Contraseña incorrecta."; return;
                    }
                    this.currentRole = 'student';
                    this.selectStudent(this.selectedStudentForLogin);
                    this.selectedStudentForLogin = null;
                },
                verifyTeacherLogin() {
                    if (this.teacherPasswordInput !== 'profesor2026') { this.teacherErrorMsg = "Contraseña incorrecta."; return; }
                    this.currentRole = 'teacher';
                    this.loadProfiles();
                },
                async createNewStudent() {
                    if (!this.newStudent.name.trim() || !this.newStudent.password) { this.createErrorMsg = "Rellena nombre y contraseña."; return; }
                    const newId = 'student_' + Date.now();
                    const initialGymSessions = this.gyms.map(gym => new Array(gym.sessions.length).fill(false));
                    const studentObj = {
                        id: newId, name: this.newStudent.name, school: this.newStudent.school || 'Colegio Kanto',
                        gender: this.newStudent.gender, password: this.newStudent.password, pin: this.newStudent.pin,
                        tokens: 0, theme: 'emerald', gymSessionsData: initialGymSessions,
                        badges: [false,false,false,false,false,false,false,false],
                        ownedPokemon: ['Pikachu'], activeTeam: ['Pikachu', null, null, null, null, null], redeemedRewards: []
                    };
                    if (this.db) {
                        await FB.setDoc(FB.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'secure_students_sessions_v12', newId), studentObj);
                    }
                    this.profilesList.push(studentObj);
                    this.currentRole = 'student';
                    this.selectStudent(studentObj);
                },
                async saveCurrentProfile() {
                    if (!this.currentStudentId || !this.db) return;
                    await FB.setDoc(FB.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'secure_students_sessions_v12', this.currentStudentId), this.currentStudent, { merge: true });
                },
                selectStudent(student) {
                    this.currentStudentId = student.id;
                    this.currentStudent = JSON.parse(JSON.stringify(student));
                    this.ensureGymSessionsData(this.currentStudent);
                    if(!this.currentStudent.badges) this.currentStudent.badges = [false,false,false,false,false,false,false,false];
                    if(!this.currentStudent.ownedPokemon) this.currentStudent.ownedPokemon = ['Pikachu'];
                    if(!this.currentStudent.activeTeam) this.currentStudent.activeTeam = ['Pikachu', null, null, null, null, null];
                    this.rotomMessage = `"¡Bzzzt! Sesión iniciada para ${this.currentStudent.name}. La Pokédex de 151 Pokémon y tu equipo titular están listos en la nube."`;
                },
                async teacherSaveStudent(student) {
                    if(!this.db) return;
                    await FB.setDoc(FB.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'secure_students_sessions_v12', student.id), student, { merge: true });
                },
                logout() { this.currentRole = null; this.currentStudentId = null; this.loadProfiles(); }
            }
        }
    </script>
</body>
</html>
